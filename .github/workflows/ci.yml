name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # ARM (ubuntu-24.04-arm): tests NEON path
  # -------------------------------------------------------------------------
  test-arm:
    name: Tests (ARM / NEON)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: |
          ./build/tests/unit/test_smoke
          ./build/tests/unit/test_distance
          ./build/tests/unit/test_distance_neon
          ./build/tests/unit/test_hnsw_ut
          ./build/tests/unit/test_wal_ut
          ./build/tests/unit/test_vector_file_ut
          ./build/tests/unit/test_graph_serializer_ut
          ./build/tests/unit/test_engine_recovery_int
          ./build/tests/unit/test_metadata_index_ut
          ./build/tests/unit/test_metadata_filter_int
          ./build/tests/unit/test_engine_full_flow_int
          ./build/tests/unit/test_concurrency_int
          ./build/tests/unit/test_e2e_int

  # -------------------------------------------------------------------------
  # Python bindings: pip install . on x86 Linux (AVX2 path)
  # -------------------------------------------------------------------------
  python-bindings:
    name: Python bindings (x86 / AVX2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install scikit-build-core pybind11 numpy pytest

      - name: pip install
        run: pip install . --no-build-isolation

      - name: Run pytest
        run: |
          pytest python/test_bindings.py -v
          pytest python/tests/test_sdk_integration.py -v

  # -------------------------------------------------------------------------
  # Memory profiling: /usr/bin/time -v + Valgrind massif (x86 Linux)
  # Runs a small insert workload (50K vectors) to measure:
  #   - Peak RSS via /usr/bin/time -v
  #   - Heap breakdown via ms_print (massif output)
  # -------------------------------------------------------------------------
  memory-profiling:
    name: Memory profiling (Valgrind massif)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build valgrind python3-pip python3-numpy

      - name: Install build dependencies
        run: pip3 install scikit-build-core pybind11

      - name: pip install
        run: pip3 install . --no-build-isolation

      - name: Install bench dependencies
        run: pip3 install h5py

      - name: Memory profile with /usr/bin/time -v
        run: |
          /usr/bin/time -v python3 bench/bench_memory.py \
            --dim 128 --n 50000 --step 50000 \
            --out /tmp/mem_results 2>&1 | tee mem_time_output.txt
          echo "--- Peak RSS from /usr/bin/time -v ---"
          grep "Maximum resident" mem_time_output.txt || true

      - name: Memory profile with Valgrind massif
        run: |
          valgrind --tool=massif \
            --massif-out-file=massif.out \
            --pages-as-heap=yes \
            python3 bench/bench_memory.py \
              --dim 128 --n 5000 --step 5000 \
              --out /tmp/mem_massif 2>/dev/null
          echo "--- Valgrind massif peak heap ---"
          ms_print massif.out | head -30

      - name: Upload massif output
        uses: actions/upload-artifact@v4
        with:
          name: massif-output
          path: massif.out

  # -------------------------------------------------------------------------
  # SIMD profiling: perf stat + flamegraph on x86 (AVX2).
  # Builds bench_profile with VECTORDB_PROFILE=ON, runs 5K queries (ef=200),
  # compares prefetch ON vs OFF via perf stat (IPC, cache-miss rate),
  # then generates a flamegraph SVG of the search hot path.
  # -------------------------------------------------------------------------
  simd-profiling:
    name: SIMD profiling (perf stat + flamegraph, x86 AVX2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git perl \
            linux-tools-common linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=1
          sudo sysctl -w kernel.kptr_restrict=0

      - name: Clone FlameGraph tools
        run: git clone --depth=1 https://github.com/brendangregg/FlameGraph /tmp/flamegraph

      - name: Build bench_profile (prefetch ON)
        run: |
          cmake -B build_prefetch -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DVECTORDB_PROFILE=ON \
            -DCMAKE_CXX_FLAGS="-fno-omit-frame-pointer"
          cmake --build build_prefetch --target bench_profile

      - name: Build bench_profile (prefetch OFF)
        run: |
          cmake -B build_noprefetch -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DVECTORDB_PROFILE=ON -DVORTEXDB_NO_PREFETCH=ON
          cmake --build build_noprefetch --target bench_profile

      - name: perf stat — prefetch ON
        run: |
          perf stat -e cycles,instructions,cache-misses,cache-references \
            ./build_prefetch/bench/bench_profile \
              --dim 128 --n 50000 --queries 5000 --ef 200 \
            2>&1 | tee perf_on.txt

      - name: perf stat — prefetch OFF
        run: |
          perf stat -e cycles,instructions,cache-misses,cache-references \
            ./build_noprefetch/bench/bench_profile \
              --dim 128 --n 50000 --queries 5000 --ef 200 \
            2>&1 | tee perf_off.txt

      - name: Summary table
        run: |
          echo "| Metric | Prefetch ON | Prefetch OFF |"
          echo "|--------|------------|--------------|"
          QPS_ON=$(grep "QPS:" perf_on.txt | awk '{print $2}')
          QPS_OFF=$(grep "QPS:" perf_off.txt | awk '{print $2}')
          MISS_ON=$(grep "cache-misses" perf_on.txt | awk '{print $1}')
          MISS_OFF=$(grep "cache-misses" perf_off.txt | awk '{print $1}')
          IPC_ON=$(grep "insn per cycle" perf_on.txt | awk '{print $1}')
          IPC_OFF=$(grep "insn per cycle" perf_off.txt | awk '{print $1}')
          echo "| QPS | $QPS_ON | $QPS_OFF |"
          echo "| cache-misses | $MISS_ON | $MISS_OFF |"
          echo "| IPC (insn/cycle) | $IPC_ON | $IPC_OFF |"

      - name: Perf report — search hot path (prefetch ON)
        run: |
          perf record -F 99 -o perf.data \
            ./build_prefetch/bench/bench_profile \
              --dim 128 --n 50000 --queries 30000 --ef 200
          echo "=== Top functions by CPU time (prefetch ON) ==="
          perf report --input=perf.data --stdio --no-children -n 2>&1 | \
            head -40 | tee perf_report_on.txt

      - name: Flamegraph — search hot path (prefetch ON)
        continue-on-error: true
        run: |
          perf record -g --call-graph dwarf -F 99 -o perf_cg.data \
            ./build_prefetch/bench/bench_profile \
              --dim 128 --n 50000 --queries 10000 --ef 200
          perf script --input=perf_cg.data 2>/dev/null | \
            /tmp/flamegraph/stackcollapse-perf.pl | \
            /tmp/flamegraph/flamegraph.pl \
              --title "VortexDB search hot path (prefetch ON, AVX2, N=50K)" \
              --width 1200 \
            > flamegraph_prefetch_on.svg
          echo "Flamegraph generated: $(wc -c < flamegraph_prefetch_on.svg) bytes"

      - name: Upload profiling artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simd-profiling-results
          path: |
            perf_on.txt
            perf_off.txt
            perf_report_on.txt
            flamegraph_prefetch_on.svg

  # -------------------------------------------------------------------------
  # x86 (ubuntu-latest): tests AVX2 path and verifies x86 compilation
  # -------------------------------------------------------------------------
  test-x86:
    name: Tests (x86 / AVX2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: |
          ./build/tests/unit/test_smoke
          ./build/tests/unit/test_distance
          ./build/tests/unit/test_distance_avx2
          ./build/tests/unit/test_hnsw_ut
          ./build/tests/unit/test_wal_ut
          ./build/tests/unit/test_vector_file_ut
          ./build/tests/unit/test_graph_serializer_ut
          ./build/tests/unit/test_engine_recovery_int
          ./build/tests/unit/test_metadata_index_ut
          ./build/tests/unit/test_metadata_filter_int
          ./build/tests/unit/test_engine_full_flow_int
          ./build/tests/unit/test_concurrency_int
          ./build/tests/unit/test_e2e_int
