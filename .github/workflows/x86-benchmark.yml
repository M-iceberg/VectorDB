name: Linux x86 AVX2 benchmark

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/x86-benchmark.yml
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite to run
        required: true
        type: choice
        default: ann
        options:
          - ann
          - storage
          - both
      n_base:
        description: Number of SIFT base vectors
        required: true
        default: "1000000"
      search_repeats:
        description: Search/latency repetitions
        required: true
        default: "3"
      build_repeats:
        description: ANN build repetitions
        required: true
        default: "1"
      threads:
        description: Explicit thread count
        required: true
        default: "4"

permissions:
  contents: write

jobs:
  benchmark:
    name: SIFT-1M on Linux x86 / AVX2
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      SIFT_SHA256: dd6f0a6ed6b7ebb8934680f861a33ed01ff33991eaee4fd60914d854a0ca5984
    steps:
      - uses: actions/checkout@v4

      - name: Record runner hardware
        run: |
          uname -a | tee linux-runner.txt
          lscpu | tee -a linux-runner.txt
          grep -m1 '^flags' /proc/cpuinfo | tee -a linux-runner.txt
          grep -m1 '^flags' /proc/cpuinfo | grep -qw avx2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install VectorDB and benchmark dependencies
        run: |
          python -m pip install scikit-build-core pybind11 numpy
          python -m pip install . --no-build-isolation
          python -m pip install h5py hnswlib faiss-cpu matplotlib psutil

      - name: Download and verify SIFT-1M
        run: |
          mkdir -p data
          curl --fail --location --retry 3 \
            https://ann-benchmarks.com/sift-128-euclidean.hdf5 \
            --output data/sift-128-euclidean.hdf5
          echo "$SIFT_SHA256  data/sift-128-euclidean.hdf5" | sha256sum --check

      - name: ANN comparison — performance mode
        if: github.event_name == 'push' || inputs.suite == 'ann' || inputs.suite == 'both'
        run: |
          python bench/bench_ann_compare.py \
            --n-base "${{ inputs.n_base || '1000000' }}" \
            --threads "${{ inputs.threads || '4' }}" \
            --repeats "${{ inputs.search_repeats || '3' }}" \
            --build-repeats "${{ inputs.build_repeats || '1' }}" \
            --vectordb-storage-mode performance \
            --out bench_results/linux_x86/performance

      - name: ANN comparison — compact mode
        if: github.event_name == 'push' || inputs.suite == 'ann' || inputs.suite == 'both'
        run: |
          python bench/bench_ann_compare.py \
            --n-base "${{ inputs.n_base || '1000000' }}" \
            --threads "${{ inputs.threads || '4' }}" \
            --repeats "${{ inputs.search_repeats || '3' }}" \
            --build-repeats "${{ inputs.build_repeats || '1' }}" \
            --vectordb-storage-mode compact \
            --out bench_results/linux_x86/compact

      - name: Storage trade-off comparison
        if: inputs.suite == 'storage' || inputs.suite == 'both'
        run: |
          python bench/bench_memory_latency.py \
            --n-base "${{ inputs.n_base || '1000000' }}" \
            --threads "${{ inputs.threads || '4' }}" \
            --repeats "${{ inputs.search_repeats || '3' }}" \
            --vectordb-modes performance compact \
            --out bench_results/linux_x86/storage_tradeoff

      - name: Commit reproducible results to the push branch
        if: github.event_name == 'push' && success()
        run: |
          cp linux-runner.txt bench_results/linux_x86/runner.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bench_results/linux_x86
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add Linux x86 AVX2 benchmark results"
          git push

      - name: Upload machine-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86-avx2-sift-results
          if-no-files-found: warn
          retention-days: 30
          path: |
            linux-runner.txt
            bench_results/linux_x86/**/results.json
            bench_results/linux_x86/**/*.png
